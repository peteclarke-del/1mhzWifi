name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify shipped ROM
        run: ./build.sh
      - name: Run contract tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Verify hardware bundle
        run: unzip -t build/pi1mhz-all-hardware-test.zip
      - name: Reject typographic dashes in documentation
        run: |
          if grep -RIn --include='*.md' --include='*.txt' -e '—' -e '–' .; then
            echo "Documentation contains a typographic dash" >&2
            exit 1
          fi
