name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unified-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ripgrep unzip zlib1g-dev imagemagick
          git clone https://github.com/stardot/beebasm.git /tmp/beebasm
          git -C /tmp/beebasm checkout ca2cc5fd2fa3f73da3b0682ad004b2aca99840c3
          make -C /tmp/beebasm/src code
          make deps
      - name: Run unified tests
        run: make test BEEBASM=/tmp/beebasm/beebasm

  pi-integration:
    # Pi1MHz owns the WiFi, UEF, secure and net services now; this package only
    # patches them. A patch that still applies can still be wrong, so apply the
    # whole integration to the pinned upstream and run the host suites that
    # live in that tree, including the two this package adds to them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git
      - name: Pi1MHz host tests against the integrated tree
        run: make test-pi-integration
